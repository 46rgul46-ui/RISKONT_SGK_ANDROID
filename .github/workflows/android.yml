name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euo pipefail
          cat \
            payload/part01.txt \
            payload/part02.txt \
            fix/p03_1.txt \
            fix/p03_2.txt \
            fix/p03_3.txt \
            payload/part04.txt \
            payload/part05.txt \
            fix/p06_1.txt \
            fix/p06_2.txt \
            fix/p06_3.txt \
            payload/part07.txt \
            payload/part08.txt \
          | tr -d '\r\n' | base64 --decode > project.zip
          unzip -t project.zip
          mkdir -p project
          unzip -q project.zip -d project

      - name: Apply V1.4 transparent text overlay fix
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('project/app/src/main/java/com/riskont/sgkform/MainActivity.kt')
          s = p.read_text()

          s = re.sub(r'^\s*put\(canvas, "0", 204f, 249\.65f, 20f\)\s*$', '', s, flags=re.M)
          for y in ('131.65','146.65','161.65','191.65','206.65'):
              s = re.sub(r'^\s*put\(canvas, "0", 441f, '+re.escape(y)+r'f, 100f\)\s*$', '', s, flags=re.M)

          m = re.search(r'(?m)^\s*(?:private\s+)?fun\s+put\s*\(', s)
          if not m:
              raise SystemExit('put() function not found')
          brace = s.find('{', m.start())
          if brace < 0:
              raise SystemExit('put() opening brace not found')
          depth = 0
          end = None
          for i in range(brace, len(s)):
              if s[i] == '{':
                  depth += 1
              elif s[i] == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit('put() closing brace not found')

          fn = s[m.start():end]
          fn = re.sub(r'(?m)^\s*canvas\.drawRect\([^\n]*\)\s*$', '', fn)
          fn = re.sub(r'(?m)^\s*canvas\.drawRoundRect\([^\n]*\)\s*$', '', fn)
          fn = re.sub(r'(?m)^\s*canvas\.drawColor\([^\n]*\)\s*$', '', fn)
          fn = re.sub(r'canvas\.drawRect\((?s:.*?)\)\s*', '', fn)
          fn = re.sub(r'canvas\.drawRoundRect\((?s:.*?)\)\s*', '', fn)

          draw = 'canvas.drawText(safeText, drawX, baseline - 2.0f, paint)'
          legacy = 'canvas.drawText(text, drawX, baseline, paint)'
          legacy2 = 'canvas.drawText(text, drawX, baseline - 2.0f, paint)'

          if 'var safeText = text' not in fn:
              old = '''        paint.textSize = size\n        paint.typeface = if (bold) Typeface.DEFAULT_BOLD else Typeface.DEFAULT\n        paint.textAlign = if (center) Paint.Align.CENTER else Paint.Align.LEFT\n        val drawX = if (center) x + maxWidth / 2f else x\n        canvas.drawText(text, drawX, baseline, paint)'''
              new = '''        paint.textSize = size\n        paint.typeface = if (bold) Typeface.DEFAULT_BOLD else Typeface.DEFAULT\n        paint.textAlign = if (center) Paint.Align.CENTER else Paint.Align.LEFT\n        var safeText = text\n        if (!center && maxWidth > 0f) {\n            while (safeText.isNotEmpty() && paint.measureText(safeText) > maxWidth - 3f) {\n                safeText = safeText.dropLast(1)\n            }\n        }\n        val drawX = if (center) x + maxWidth / 2f else x\n        canvas.drawText(safeText, drawX, baseline - 2.0f, paint)'''
              fn = fn.replace(old, new)

          marker = 'paint.color = android.graphics.Color.BLACK\n        paint.alpha = 255\n        paint.style = android.graphics.Paint.Style.FILL\n        '
          if draw in fn:
              fn = fn.replace(draw, marker + draw)
          elif legacy2 in fn:
              fn = fn.replace(legacy2, marker + legacy2)
          elif legacy in fn:
              fn = fn.replace(legacy, marker + 'canvas.drawText(text, drawX, baseline - 2.0f, paint)')
          else:
              raise SystemExit('drawText in put() not found')

          if 'canvas.drawRect(' in fn or 'canvas.drawRoundRect(' in fn or 'canvas.drawColor(' in fn:
              raise SystemExit('background drawing still exists in put()')

          s = s[:m.start()] + fn + s[end:]
          p.write_text(s)
          print('V1.4 compile fix: text-only overlay with fully-qualified Android graphics classes.')

      - name: Package reconstructed source
        shell: bash
        run: |
          cd project
          zip -qr ../RISKONT_SGK_ANDROID_SOURCE_V1_4.zip .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        shell: bash
        run: cp project/app/build/outputs/apk/debug/app-debug.apk RISKONT_SGK_FORM_ANDROID_V1_4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RISKONT-SGK-Android-V1-4
          path: RISKONT_SGK_FORM_ANDROID_V1_4.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: RISKONT-SGK-Android-Source-V1-4
          path: RISKONT_SGK_ANDROID_SOURCE_V1_4.zip
          if-no-files-found: error
          retention-days: 30
