name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part*.txt | tr -d '\r\n' | base64 --decode > project.zip
          unzip -t project.zip
          mkdir -p project
          unzip -q project.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/java/com/riskont/sgkform/MainActivity.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk RISKONT_SGK_FORM.apk
          ls -lh RISKONT_SGK_FORM.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RISKONT-SGK-Android-APK
          path: RISKONT_SGK_FORM.apk
          if-no-files-found: error
          retention-days: 30
