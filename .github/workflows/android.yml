name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euo pipefail
          cat \
            payload/part01.txt \
            payload/part02.txt \
            fix/p03_1.txt \
            fix/p03_2.txt \
            fix/p03_3.txt \
            payload/part04.txt \
            payload/part05.txt \
            fix/p06_1.txt \
            fix/p06_2.txt \
            fix/p06_3.txt \
            payload/part07.txt \
            payload/part08.txt \
          | tr -d '\r\n' | base64 --decode > project.zip
          unzip -t project.zip
          mkdir -p project
          unzip -q project.zip -d project

      - name: Apply V1.3 safe-cell PDF fix
        shell: python
        run: |
          from pathlib import Path
          p=Path('project/app/src/main/java/com/riskont/sgkform/MainActivity.kt')
          s=p.read_text()
          # Gereksiz sifirlari kaldir; vergi numarasindaki sabit 0 korunur.
          import re
          s=re.sub(r'^\s*put\(canvas, "0", 204f, 249\.65f, 20f\)\s*$', '', s, flags=re.M)
          for y in ('131.65','146.65','161.65','191.65','206.65'):
              s=re.sub(r'^\s*put\(canvas, "0", 441f, '+re.escape(y)+r'f, 100f\)\s*$', '', s, flags=re.M)
          # Android fontunun baseline farkini hucrenin icine cek.
          s=s.replace('canvas.drawText(text, drawX, baseline, paint)', 'canvas.drawText(text, drawX, baseline - 2.0f, paint)')
          # Uzun metinlerin hucre sinirini gecmesini engelle: maxWidth zaten put() ile geliyor.
          old='''        paint.textSize = size\n        paint.typeface = if (bold) Typeface.DEFAULT_BOLD else Typeface.DEFAULT\n        paint.textAlign = if (center) Paint.Align.CENTER else Paint.Align.LEFT\n        val drawX = if (center) x + maxWidth / 2f else x\n        canvas.drawText(text, drawX, baseline - 2.0f, paint)'''
          new='''        paint.textSize = size\n        paint.typeface = if (bold) Typeface.DEFAULT_BOLD else Typeface.DEFAULT\n        paint.textAlign = if (center) Paint.Align.CENTER else Paint.Align.LEFT\n        var safeText = text\n        if (!center && maxWidth > 0f) {\n            while (safeText.isNotEmpty() && paint.measureText(safeText) > maxWidth - 3f) {\n                safeText = safeText.dropLast(1)\n            }\n        }\n        val drawX = if (center) x + maxWidth / 2f else x\n        canvas.drawText(safeText, drawX, baseline - 2.0f, paint)'''
          if old in s: s=s.replace(old,new)
          p.write_text(s)
          assert 'baseline - 2.0f' in s

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        shell: bash
        run: cp project/app/build/outputs/apk/debug/app-debug.apk RISKONT_SGK_FORM_ANDROID_V1_3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RISKONT-SGK-Android-V1-3
          path: RISKONT_SGK_FORM_ANDROID_V1_3.apk
          if-no-files-found: error
          retention-days: 30
