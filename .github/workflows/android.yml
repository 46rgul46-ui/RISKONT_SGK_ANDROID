name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euo pipefail
          cat \
            payload/part01.txt \
            payload/part02.txt \
            fix/p03_1.txt \
            fix/p03_2.txt \
            fix/p03_3.txt \
            payload/part04.txt \
            payload/part05.txt \
            fix/p06_1.txt \
            fix/p06_2.txt \
            fix/p06_3.txt \
            payload/part07.txt \
            payload/part08.txt \
          | tr -d '\r\n' | base64 --decode > project.zip
          unzip -t project.zip
          mkdir -p project
          unzip -q project.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/java/com/riskont/sgkform/MainActivity.kt

      - name: Apply V1.2 PDF table alignment fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('project/app/src/main/java/com/riskont/sgkform/MainActivity.kt')
          s = p.read_text()
          # Bos/istenmeyen alanlara otomatik 0 basimini kaldir. Vergi No=0 sabit kalir.
          for line in [
              '        put(canvas, "0", 204f, 249.65f, 20f)\n',
              '        put(canvas, "0", 441f, 131.65f, 100f)\n',
              '        put(canvas, "0", 441f, 146.65f, 100f)\n',
              '        put(canvas, "0", 441f, 161.65f, 100f)\n',
              '        put(canvas, "0", 441f, 191.65f, 100f)\n',
              '        put(canvas, "0", 441f, 206.65f, 100f)\n',
          ]:
              s = s.replace(line, '')
          # Android font baseline farki: metinleri tablo alt cizgisinden 2 pt yukariya al.
          old = 'canvas.drawText(text, drawX, baseline, paint)'
          new = 'canvas.drawText(text, drawX, baseline - 2.0f, paint)'
          if old not in s and new not in s:
              raise SystemExit('drawText satiri bulunamadi')
          s = s.replace(old, new)
          p.write_text(s)
          # Kontrol: istenmeyen 0 satirlari kalmamis olmali.
          assert 'put(canvas, "0", 441f, 131.65f' not in s
          assert 'baseline - 2.0f' in s

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk RISKONT_SGK_FORM_ANDROID_V1_2_TABLE_FIX.apk
          ls -lh RISKONT_SGK_FORM_ANDROID_V1_2_TABLE_FIX.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RISKONT-SGK-Android-V1-2-Table-Fix
          path: RISKONT_SGK_FORM_ANDROID_V1_2_TABLE_FIX.apk
          if-no-files-found: error
          retention-days: 30
