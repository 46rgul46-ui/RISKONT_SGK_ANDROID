name: Build Android V2 APK

on:
  push:
    branches: [ android-v2 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct base Android project
        shell: bash
        run: |
          set -euo pipefail
          cat \
            payload/part01.txt \
            payload/part02.txt \
            fix/p03_1.txt \
            fix/p03_2.txt \
            fix/p03_3.txt \
            payload/part04.txt \
            payload/part05.txt \
            fix/p06_1.txt \
            fix/p06_2.txt \
            fix/p06_3.txt \
            payload/part07.txt \
            payload/part08.txt \
          | tr -d '\r\n' | base64 --decode > project.zip
          unzip -t project.zip
          rm -rf project
          mkdir -p project
          unzip -q project.zip -d project

      - name: Apply Android V2 source overlay
        shell: bash
        run: |
          set -euo pipefail
          cat v2overlay/chunk00.txt v2overlay/chunk01.txt v2overlay/chunk02.txt v2overlay/chunk03.txt \
            | tr -d '\r\n' | base64 --decode > v2_overlay.tar.gz
          tar -xzf v2_overlay.tar.gz -C project

          # The exact Özen Çelik logo crop is embedded in the overlay as the xhdpi launcher.
          # Reuse it for the remaining launcher densities and the in-app brand image.
          for d in mdpi hdpi xxhdpi xxxhdpi; do
            mkdir -p "project/app/src/main/res/mipmap-${d}"
            cp project/app/src/main/res/mipmap-xhdpi/ic_launcher.png "project/app/src/main/res/mipmap-${d}/ic_launcher.png"
          done
          mkdir -p project/app/src/main/res/drawable-nodpi
          cp project/app/src/main/res/mipmap-xhdpi/ic_launcher.png project/app/src/main/res/drawable-nodpi/ozen_celik_logo.png

          test -s project/app/src/main/java/com/riskont/sgkform/MainActivity.kt
          test -s project/app/src/main/res/layout/activity_main.xml
          test -s project/app/src/main/res/drawable-nodpi/ozen_celik_logo.png
          echo "Android V2 overlay applied."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          cp project/app/build/outputs/apk/debug/app-debug.apk RISKONT_SGK_FORM_ANDROID_V2_0.apk
          ls -lh RISKONT_SGK_FORM_ANDROID_V2_0.apk
          sha256sum RISKONT_SGK_FORM_ANDROID_V2_0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RISKONT-SGK-Android-V2-0
          path: RISKONT_SGK_FORM_ANDROID_V2_0.apk
          if-no-files-found: error
          retention-days: 30
