name: Build V6.8 Adaptive Aggressive OCR APK

on:
  push:
    branches:
      - build-v68-apk-20260915
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android base and V6.8 OCR patch
        shell: bash
        run: |
          set -euo pipefail
          cat v66_payload/part_*.txt | tr -d '\r\n' | base64 --decode > project.zip
          echo "85d5c702d7e0012ada55432ecc1c66e4fe7a8947cd1f9b6d7a69b121b75ff81b  project.zip" | sha256sum -c -
          unzip -t project.zip >/dev/null
          rm -rf project
          mkdir project
          unzip -q project.zip -d project

          cat v68_patch_payload/part_*.txt | tr -d '\r\n' | base64 --decode > v68_patch.zip
          echo "c586ec897b6a5831a37e11bc9d4c32f05239e10a734883c41c06e6ae5e5a4457  v68_patch.zip" | sha256sum -c -
          unzip -t v68_patch.zip >/dev/null
          rm -rf v68_patch
          mkdir v68_patch
          unzip -q v68_patch.zip -d v68_patch
          cp v68_patch/*.java project/app/src/main/java/tr/riskont/sgkform/

          test -f project/app/src/main/java/tr/riskont/sgkform/OcrEngine.java
          test -f project/app/src/main/java/tr/riskont/sgkform/ImageTools.java
          grep -q 'AGGRESSIVE_MODES' project/app/src/main/java/tr/riskont/sgkform/OcrEngine.java
          grep -q 'detectGridRois' project/app/src/main/java/tr/riskont/sgkform/ImageTools.java

      - name: Configure V6.8 Android project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('project/app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = g.replace('versionCode 66', 'versionCode 68')
          g = g.replace("versionName '6.6'", "versionName '6.8'")
          g = g.replace("implementation 'com.rmtheis:tess-two:9.1.0'", "implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'")
          if "pickFirsts += ['**/libc++_shared.so']" not in g:
              g = g.replace('useLegacyPackaging = true\n        }', "useLegacyPackaging = true\n            pickFirsts += ['**/libc++_shared.so']\n        }")
          # Make OCR model presence a hard build-time requirement.
          if "tasks.register('verifyTessdata')" not in g:
              g += '''\n\n// V6.8 offline Turkish OCR model verification.\ntasks.register('verifyTessdata') {\n    def model = file('src/main/assets/tessdata/tur.traineddata')\n    inputs.file(model)\n    doLast {\n        if (!model.exists() || model.length() < 1000000L) {\n            throw new GradleException('OCR modeli eksik: src/main/assets/tessdata/tur.traineddata')\n        }\n    }\n}\npreBuild.dependsOn verifyTessdata\n'''
          gradle.write_text(g, encoding='utf-8')

          settings = Path('project/settings.gradle')
          s = settings.read_text(encoding='utf-8')
          if 'jitpack.io' not in s:
              s = s.replace('mavenCentral()\n    }\n}', "mavenCentral()\n        maven { url = uri('https://jitpack.io') }\n    }\n}", 1)
          s = s.replace('rootProject.name = "GeciciKorumaSGKFormV66"', 'rootProject.name = "GeciciKorumaSGKFormV68"')
          settings.write_text(s, encoding='utf-8')

          props = Path('project/gradle.properties')
          p = props.read_text(encoding='utf-8') if props.exists() else ''
          lines = [x for x in p.splitlines() if not x.startswith('android.useAndroidX=')]
          lines.append('android.useAndroidX=true')
          props.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          grep -q "versionCode 68" project/app/build.gradle
          grep -q "versionName '6.8'" project/app/build.gradle
          grep -q "tesseract4android:4.9.0" project/app/build.gradle
          grep -q "jitpack.io" project/settings.gradle
          grep -q '^android.useAndroidX=true$' project/gradle.properties

      - name: Install high-accuracy Turkish OCR model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project/app/src/main/assets/tessdata
          rm -f project/app/src/main/assets/tessdata/tur.traineddata
          curl -L --fail --retry 4 --retry-delay 2 \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/tur.traineddata \
            -o project/app/src/main/assets/tessdata/tur.traineddata
          SIZE=$(stat -c%s project/app/src/main/assets/tessdata/tur.traineddata)
          echo "Turkish tessdata_best size: $SIZE bytes"
          test "$SIZE" -gt 1000000
          sha256sum project/app/src/main/assets/tessdata/tur.traineddata | tee tur.traineddata.sha256

      - name: Verify V6.8 SGK template
        shell: bash
        run: |
          set -euo pipefail
          echo "b2eb947c8e39efe85a90f43a2d5836886d581858cbcd1e6e237dcc73c74075f3  project/app/src/main/assets/sgk_referans_form.pdf" | sha256sum -c -

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build V6.8 Release APK
        working-directory: project
        run: gradle --no-daemon assembleRelease

      - name: Verify V6.8 APK
        shell: bash
        run: |
          set -euo pipefail
          APK=project/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/sgk_referans_form.pdf'
          unzip -l "$APK" | grep -q 'assets/tessdata/tur.traineddata'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libtesseract.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/.*opencv'
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk_badging.txt
          grep -q "versionCode='68'" apk_badging.txt
          grep -q "versionName='6.8'" apk_badging.txt
          cp "$APK" GECICI_KORUMA_SGK_FORM_V6_8_ADAPTIF_SALDIRGAN_OCR.apk
          sha256sum GECICI_KORUMA_SGK_FORM_V6_8_ADAPTIF_SALDIRGAN_OCR.apk > GECICI_KORUMA_SGK_FORM_V6_8_ADAPTIF_SALDIRGAN_OCR.apk.sha256

      - name: Upload V6.8 APK
        uses: actions/upload-artifact@v4
        with:
          name: GECICI-KORUMA-SGK-FORM-V6-8-ADAPTIF-SALDIRGAN-OCR
          path: |
            GECICI_KORUMA_SGK_FORM_V6_8_ADAPTIF_SALDIRGAN_OCR.apk
            GECICI_KORUMA_SGK_FORM_V6_8_ADAPTIF_SALDIRGAN_OCR.apk.sha256
            tur.traineddata.sha256
          if-no-files-found: error
          retention-days: 30
