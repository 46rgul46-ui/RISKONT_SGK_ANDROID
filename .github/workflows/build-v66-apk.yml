name: Build V6.6 APK

on:
  push:
    branches:
      - build-v66-apk-20260913
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct V6.6 project
        shell: bash
        run: |
          set -euo pipefail
          cat v66_payload/part_*.txt | tr -d '\r\n' | base64 --decode > project.zip
          echo "85d5c702d7e0012ada55432ecc1c66e4fe7a8947cd1f9b6d7a69b121b75ff81b  project.zip" | sha256sum -c -
          unzip -t project.zip
          rm -rf project
          mkdir project
          unzip -q project.zip -d project

      - name: Download Turkish OCR model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project/app/src/main/assets/tessdata
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/tur.traineddata \
            -o project/app/src/main/assets/tessdata/tur.traineddata
          echo "7393381111e1152420fc4092cb44eef4237580d21b92bf30d7d221aad192c6b7  project/app/src/main/assets/tessdata/tur.traineddata" | sha256sum -c -

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        working-directory: project
        run: gradle --no-daemon assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=project/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'assets/sgk_referans_form.pdf'
          unzip -l "$APK" | grep -q 'assets/tessdata/tur.traineddata'
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" GECICI_KORUMA_SGK_FORM_V6_6.apk
          sha256sum GECICI_KORUMA_SGK_FORM_V6_6.apk > GECICI_KORUMA_SGK_FORM_V6_6.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GECICI-KORUMA-SGK-FORM-V6-6
          path: |
            GECICI_KORUMA_SGK_FORM_V6_6.apk
            GECICI_KORUMA_SGK_FORM_V6_6.apk.sha256
          if-no-files-found: error
          retention-days: 30
