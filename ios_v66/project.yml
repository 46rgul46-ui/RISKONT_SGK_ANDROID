name: GeciciKorumaSGK
options:
  bundleIdPrefix: tr.riskont
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
targets:
  GeciciKorumaSGK:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.riskont.sgkform.ios
        PRODUCT_NAME: GeciciKorumaSGK
        CURRENT_PROJECT_VERSION: 66
        MARKETING_VERSION: 6.6
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 'Geçici Koruma SGK'
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 'Kimlik fotoğrafını seçip yalnızca cihaz üzerinde OCR ile okumak için fotoğraf erişimi gerekir.'
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        SUPPORTS_MACCATALYST: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    scheme:
      testTargets: []
